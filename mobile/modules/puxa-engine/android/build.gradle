plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.puxa.engine'
version = '0.1.0'

android {
  namespace "app.puxa.engine"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Extrator do YouTube do app NewPipe (Java puro), servido pelo JitPack. A 0.27 deixou os
  // clientes Android e iOS, que pararam de entregar a mídia, e ficou com o web e o visionOS.
  implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.27.1'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'androidx.core:core-ktx:1.13.1'
  // FFmpeg 6.1.1 com bibliotecas alinhadas a 16 KB (fork mantido do FFmpegKit, LGPL):
  // montagem do modo Criar, cortes de vídeo, legendas gravadas e MP3
  implementation 'com.moizhassan.ffmpeg:ffmpeg-kit-16kb:6.1.1'
  // Tradutor offline do Google para legendas em pt-BR quando o YouTube limita a tradução
  implementation 'com.google.mlkit:translate:17.0.3'
}
